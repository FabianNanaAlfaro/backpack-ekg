<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Backpack EKG public engineering architecture</title>
  <desc id="desc">Two AD8232 acquisition channels feed ESP32 filtering and lead derivation, then display, SD logging and a power subsystem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071a2f"/>
      <stop offset="1" stop-color="#102f49"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#24d4d8"/>
      <stop offset="1" stop-color="#66e3ff"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0" stop-color="#f6b73c"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020812" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65e6f0"/>
    </marker>
    <style>
      .label{font:700 18px Inter,Arial,sans-serif;letter-spacing:.08em;fill:#9ec7dc}
      .title{font:800 28px Inter,Arial,sans-serif;fill:#f7fbff}
      .body{font:500 18px Inter,Arial,sans-serif;fill:#d3e8f0}
      .small{font:500 15px Inter,Arial,sans-serif;fill:#91b5c6}
      .card{fill:#0b263d;stroke:#25506a;stroke-width:2}
      .sub{fill:#143750;stroke:#2b6175;stroke-width:2}
      .wire{fill:none;stroke:url(#cyan);stroke-width:5;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1400" height="820" rx="34" fill="url(#bg)"/>
  <circle cx="1220" cy="-60" r="290" fill="#1b7892" opacity=".14"/>
  <circle cx="90" cy="830" r="260" fill="#d28a22" opacity=".10"/>
  <text x="70" y="74" class="label">BACKPACK EKG · PUBLIC ENGINEERING VIEW</text>
  <text x="70" y="119" class="title">From biopotential capture to an offline screening trace</text>
  <text x="70" y="151" class="small">Two measured leads · digitally derived Lead III · timestamped BPM · local storage</text>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="270" height="280" rx="24" class="card"/>
    <text x="98" y="247" class="label">01 · ACQUIRE</text>
    <rect x="98" y="275" width="214" height="64" rx="15" class="sub"/>
    <text x="120" y="303" class="body">AD8232 / XS1</text>
    <text x="120" y="326" class="small">measured lead I</text>
    <rect x="98" y="358" width="214" height="64" rx="15" class="sub"/>
    <text x="120" y="386" class="body">AD8232 / XS2</text>
    <text x="120" y="409" class="small">measured lead II</text>
    <text x="98" y="457" class="small">analog front end · RLD</text>

    <rect x="425" y="205" width="320" height="280" rx="24" class="card"/>
    <text x="453" y="247" class="label">02 · PROCESS</text>
    <rect x="453" y="275" width="264" height="58" rx="15" fill="url(#amber)"/>
    <text x="474" y="310" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#10263a">ESP32 · 12-bit ADC</text>
    <rect x="453" y="350" width="264" height="94" rx="15" class="sub"/>
    <text x="474" y="379" class="body">filter + derive</text>
    <text x="474" y="405" class="small">Lead III = Lead II − Lead I</text>
    <text x="474" y="428" class="small">nominal 1 ms update clock</text>

    <rect x="830" y="205" width="240" height="280" rx="24" class="card"/>
    <text x="858" y="247" class="label">03 · ESTIMATE</text>
    <rect x="858" y="275" width="184" height="76" rx="15" class="sub"/>
    <text x="879" y="305" class="body">hysteresis</text>
    <text x="879" y="330" class="small">upper / lower</text>
    <rect x="858" y="370" width="184" height="74" rx="15" fill="#153f57" stroke="#2d9bae" stroke-width="2"/>
    <text x="879" y="402" class="body">30–330 BPM</text>
    <text x="879" y="427" class="small">7-valid-value mean</text>

    <rect x="1155" y="205" width="175" height="280" rx="24" class="card"/>
    <text x="1183" y="247" class="label">04 · OUTPUT</text>
    <rect x="1183" y="275" width="119" height="76" rx="15" fill="#e9f8ff"/>
    <text x="1200" y="306" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="900" fill="#10263a">BPM</text>
    <text x="1200" y="333" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#157b8d">screen</text>
    <rect x="1183" y="370" width="119" height="74" rx="15" class="sub"/>
    <text x="1202" y="401" class="body">TFT</text>
    <text x="1202" y="425" class="small">SD / BT</text>
  </g>

  <path d="M 340 345 C 375 345 385 345 425 345" class="wire"/>
  <path d="M 745 345 C 780 345 792 345 830 345" class="wire"/>
  <path d="M 1070 345 C 1100 345 1120 345 1155 345" class="wire"/>
  <text x="354" y="325" class="small">conditioned</text>
  <text x="354" y="344" class="small">analog (2 ch)</text>
  <text x="754" y="325" class="small">filtered streams</text>
  <text x="1082" y="325" class="small">validated rate</text>

  <g filter="url(#shadow)">
    <rect x="70" y="565" width="1260" height="165" rx="24" class="card"/>
    <text x="100" y="607" class="label">05 · POWER + DEPLOYMENT</text>
    <rect x="100" y="633" width="235" height="60" rx="15" class="sub"/>
    <text x="126" y="668" class="body">PV panel / DC input</text>
    <path d="M 335 663 H 410" class="wire"/>
    <rect x="410" y="633" width="245" height="60" rx="15" class="sub"/>
    <text x="435" y="668" class="body">TP4056 + Li-ion</text>
    <path d="M 655 663 H 730" class="wire"/>
    <rect x="730" y="633" width="245" height="60" rx="15" class="sub"/>
    <text x="757" y="668" class="body">regulated 3.3 V rail</text>
    <path d="M 975 663 H 1048" class="wire"/>
    <rect x="1048" y="633" width="252" height="60" rx="15" class="sub"/>
    <text x="1074" y="668" class="body">portable backpack form</text>
  </g>

  <text x="70" y="784" class="small">Engineering companion · no patient recordings · no private database · no diagnostic interpretation</text>
</svg>

